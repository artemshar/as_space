<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Artem Shar . Space  — personal site. Engineering, product, and conversation."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0d0c" />
    <link rel="canonical" href="https://artemshar.space/" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/main.css" />
    <script>
      try {
        var t = localStorage.getItem("artemshar.space-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (_) {}
    </script>
    <title>Artem Shar ⊙ Space</title>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <div class="page">
      <div class="shell">
        <header class="site-header">
          <a class="wordmark" href="/">Artem Shar<svg class="wordmark-dot" viewBox="0 0 24 24" aria-hidden="true"><circle class="wordmark-dot__ring" cx="12" cy="12" r="8" /><circle class="wordmark-dot__dot" cx="12" cy="12" r="1" /></svg> Space</a>
        </header>

        <main id="main" class="site-main">
          <section class="hero" aria-labelledby="hero-heading">
            <div class="hero-intro">
              <div class="hero-avatar-wrap">
                <img
                  class="hero-avatar"
                  src="images/artem_a.jpg"
                  alt="Artem Shar"
                  width="220"
                  height="220"
                  decoding="async"
                  loading="eager"
                  onload="this.classList.add('is-loaded')"
                />
              </div>
              <h2 class="hero-tagline">
                <span class="hero-tagline__strong">— Software Engineer </span> with extensive experience in
                <br class="hero-tagline__break" />
                <span class="hoverhlt">Full-Stack &amp; Front-End development</span>
              </h2>
            </div>
            <nav aria-label="Primary">
              <ul class="nav-primary">
                <li><a href="/" aria-current="page">Home</a></li>
                <li><a href="#contact">Contact</a></li>
              </ul>
            </nav>
          </section>

          <section id="contact" aria-labelledby="contact-heading">
            <h2 id="contact-heading" class="section-title">Elsewhere</h2>
            <ul class="contact-list">
              <li>
                <a href="mailto:artem.ude@gmail.com" rel="me" title="artem.ude@gmail.com">
                  <span class="visually-hidden">Email</span>
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <use href="icons/sprite.svg#email"></use>
                  </svg>
                </a>
              </li>
              <li>
                <a href="https://www.linkedin.com/in/artemshar" rel="me noreferrer" target="_blank" title="@artemshar on LinkedIn">
                  <span class="visually-hidden">LinkedIn</span>
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <use href="icons/sprite.svg#linkedin"></use>
                  </svg>
                </a>
              </li>
              <li>
                <a href="https://t.me/artemshar" rel="me noreferrer" target="_blank" title="Telegram: t.me/artemshar">
                  <span class="visually-hidden">Telegram</span>
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <use href="icons/sprite.svg#telegram"></use>
                  </svg>
                </a>
              </li>
              <li>
                <a href="https://github.com/artemshar" rel="me noreferrer" target="_blank" title="@artemshar on GitHub">
                  <span class="visually-hidden">GitHub</span>
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <use href="icons/sprite.svg#github"></use>
                  </svg>
                </a>
              </li>
              <li>
                <a href="https://www.producthunt.com/@artemshar" rel="me noreferrer" target="_blank" title="@artemshar on Product Hunt">
                  <span class="visually-hidden">Product Hunt</span>
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <use href="icons/sprite.svg#producthunt"></use>
                  </svg>
                </a>
              </li>
            </ul>
          </section>
        </main>

        <footer class="site-footer">
          <span>© <span id="y"></span> Artem Shar</span>
          <div class="footer-end">
            <span>Built with web standards.</span>
            <button
              type="button"
              class="theme-toggle"
              data-theme-toggle
              aria-label="Theme: System theme. Click to switch."
              title="System theme"
            >
              <svg data-icon="sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" hidden>
                <use href="icons/sprite.svg#theme-sun"></use>
              </svg>
              <svg data-icon="moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" hidden>
                <use href="icons/sprite.svg#theme-moon"></use>
              </svg>
            </button>
          </div>
        </footer>
      </div>
    </div>

    <script>
      document.getElementById("y").textContent = new Date().getFullYear();
    </script>
    <script src="js/theme.js" defer></script>
  </body>
</html>
